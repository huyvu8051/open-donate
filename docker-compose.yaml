services:
  app-db:
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=open_donate
    ports:
      - "5432:5432"
    volumes:
      - 'app_db_data:/var/lib/postgresql/data:rw'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d open_donate"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@app-db:5432/open_donate
      - LEPTOS_SITE_ADDR=0.0.0.0:3000
      - S3_ACCESS_KEY=dq9Mb3XpS6Sn3zXsuXi4
      - S3_SECRET_KEY=BSDbbJH5xksKQlPcFeVcg5pcqEvbkzjggxxPdvzH
      - S3_REGION=us-east-1
      - S3_ENDPOINT=https://s3.unghotui.vn
      - S3_BUCKET=open-donate
    depends_on:
      app-db:
        condition: service_healthy

  e2e:
    image: mcr.microsoft.com/playwright:v1.44.1-jammy
    volumes:
      - .:/app
    working_dir: /app/e2e
    environment:
      - BASE_URL=http://app:3000
    command: bash -c "npm install && npx playwright test --project=chromium"
    depends_on:
      app:
        condition: service_started

  k6:
    image: grafana/k6:latest
    volumes:
      - ./load-test:/load-test
    environment:
      - BASE_URL=http://app:3000
    entrypoint: ["k6", "run", "/load-test/stress.js"]
    depends_on:
      app:
        condition: service_started

volumes:
  app_db_data:
