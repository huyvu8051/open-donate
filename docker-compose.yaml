services:
  app-db:
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=open_donate
    ports:
      - "5432:5432"
    volumes:
      - 'app_db_data:/var/lib/postgresql/data:rw'

volumes:
  app_db_data:
